name: Update Notion Stock Prices

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/update-stocks.yml'
  schedule:
    # UTC Tue-Sat 00:17 = 北京时间周二至周六 08:17；避开整点拥堵
    - cron: '17 0 * * 2-6'
  workflow_dispatch:  # 手动触发

concurrency:
  group: stock-updater-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check scripts importable
        run: |
          python -c "
          import requests, yfinance, numpy, sklearn
          print('All packages OK')
          "
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Check env vars present
        if: github.event_name != 'pull_request'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
        run: |
          test -n "$NOTION_TOKEN" || (echo "::error::NOTION_TOKEN missing in Secrets"; exit 1)
          test -n "$DATABASE_ID" || (echo "::error::DATABASE_ID missing in Secrets"; exit 1)
          echo "All secrets present"

  update:
    needs: smoke-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run stock updater
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
        run: python -u scripts/update_notion.py
